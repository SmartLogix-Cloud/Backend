# ===========================================================================
# Clúster RabbitMQ de 2 nodos (EP2) — configuración común a rabbit1 y rabbit2
# ---------------------------------------------------------------------------
# Descubrimiento de pares DECLARATIVO (classic_config): cada nodo conoce de
# antemano a los miembros del clúster. El segundo nodo en arrancar se une
# automáticamente al primero. Ambos nodos comparten el mismo Erlang cookie
# (variable RABBITMQ_ERLANG_COOKIE en el compose), requisito para clusterizar.
# ===========================================================================

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Ante una partición de red, los nodos se re-sincronizan solos al reconectar.
cluster_partition_handling = autoheal

# Permite que el usuario por defecto (RABBITMQ_DEFAULT_USER) se conecte desde
# otros contenedores y no solo desde loopback.
loopback_users = none

# Puerto de la UI de administración / API HTTP de management.
management.tcp.port = 15672
