# ===========================================================================
# SmartLogix - Cluster RabbitMQ de 2 nodos (rabbit@rabbit1 + rabbit@rabbit2)
# Se monta en /etc/rabbitmq/conf.d/ de cada nodo.
# ===========================================================================

# Formacion automatica del cluster: cada nodo conoce la lista de pares.
# Solo aplica al primer arranque de un nodo "virgen" (sin datos previos).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Reintenta encontrar al par mientras la otra instancia termina de arrancar
cluster_formation.discovery_retry_limit = 60
cluster_formation.discovery_retry_interval = 5000

# Ante una particion de red, el nodo "perdedor" se reinicia y se re-sincroniza
cluster_partition_handling = autoheal

# Puerto fijo de distribucion Erlang (25672) para poder abrirlo en el Security Group
distribution.listener.port_range.min = 25672
distribution.listener.port_range.max = 25672

# El usuario por defecto puede conectarse desde otras maquinas (no solo loopback)
loopback_users = none
