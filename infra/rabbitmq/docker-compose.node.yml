name: smartlogix-rabbitmq

# ===========================================================================
# SmartLogix - UN nodo del cluster RabbitMQ (despliegue multi-instancia)
# ---------------------------------------------------------------------------
# Cada nodo corre en una EC2 distinta y se une al cluster por la red privada:
#
#   EC2-mq1:  RABBIT_NODE_HOST=rabbit1  RABBIT_PEER_HOST=rabbit2  RABBIT_PEER_IP=<IP privada EC2-mq2>
#   EC2-mq2:  RABBIT_NODE_HOST=rabbit2  RABBIT_PEER_HOST=rabbit1  RABBIT_PEER_IP=<IP privada EC2-mq1>
#
# Ambos nodos DEBEN usar la misma RABBITMQ_ERLANG_COOKIE.
#
# Puertos publicados (abrirlos en el Security Group entre las EC2 de la VPC):
#   4369   epmd (descubrimiento de nodos Erlang)
#   25672  distribucion Erlang (comunicacion entre nodos del cluster)
#   5672   AMQP (microservicios)
#   15672  UI de administracion
#
# Levantar (en cada EC2):  cp .env.node.example .env   (ajustar valores)
#                          docker compose -f docker-compose.node.yml up -d
# ===========================================================================

volumes:
  rabbitmq-data:

services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # El hostname define el nombre del nodo: rabbit@rabbit1 / rabbit@rabbit2
    hostname: ${RABBIT_NODE_HOST:?Definir RABBIT_NODE_HOST (rabbit1 o rabbit2)}
    container_name: smartlogix-${RABBIT_NODE_HOST}
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@${RABBIT_NODE_HOST}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Definir RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Definir RABBITMQ_PASSWORD}
      # Cookie Erlang compartida (autentica a los nodos entre si)
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie ${RABBITMQ_ERLANG_COOKIE:?Definir RABBITMQ_ERLANG_COOKIE}"
      RABBITMQ_CTL_ERL_ARGS: "-setcookie ${RABBITMQ_ERLANG_COOKIE}"
    extra_hosts:
      # Resuelve el nombre del nodo par a la IP privada de la otra EC2
      - "${RABBIT_PEER_HOST:?Definir RABBIT_PEER_HOST}:${RABBIT_PEER_IP:?Definir RABBIT_PEER_IP}"
    ports:
      - "4369:4369"
      - "25672:25672"
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
