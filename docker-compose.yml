name: smartlogix

networks:
  web:
    name: smartlogix_web
  internal:
    name: smartlogix_internal
    internal: true

volumes:
  pg-inventory-data:
  pg-order-data:
  pg-shipping-data:
  pg-user-data:
  pg-auth-data:
  rabbit1-data:
  rabbit2-data:

services:
  # ===========================================================
  # Capa de entrada - Ingress Controller
  # ===========================================================
  traefik:
    image: traefik:v3.5
    container_name: smartlogix-traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      # Dashboard accesible via http://traefik.smartlogix.localhost
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - web

  # ===========================================================
  # Capa de seguridad - API Gateway Krakend
  # ===========================================================
  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: smartlogix-api-gateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - bff
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=smartlogix_web"
      - "traefik.http.routers.api.rule=Host(`api.smartlogix.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.routers.api.middlewares=secure-headers@file,rate-limit@file,cors-api@file"

  # ===========================================================
  # Capa de adaptacion - BFF Node.js 20
  # ===========================================================
  bff:
    build:
      context: ./backend/bff
    container_name: smartlogix-bff
    restart: unless-stopped
    environment:
      PORT: 3000
      MS_INVENTORY_URL: http://ms-inventory:8080
      MS_ORDER_URL: http://ms-order:8080
      MS_SHIPPING_URL: http://ms-shipping:8080
      MS_USER_URL: http://ms-user:8080
      MS_AUTH_URL: http://ms-auth:8081
      MS_BROKER_ADMIN_URL: http://ms-broker-admin:8080
      BFF_GLITCHTIP_DSN: ${BFF_GLITCHTIP_DSN:-}
    depends_on:
      - ms-inventory
      - ms-order
      - ms-shipping
      - ms-user
      - ms-auth
      - ms-broker-admin
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=smartlogix_web"
      - "traefik.http.routers.bff.rule=Host(`bff.smartlogix.localhost`)"
      - "traefik.http.routers.bff.entrypoints=web"
      - "traefik.http.services.bff.loadbalancer.server.port=3000"

  # ===========================================================
  # Capa de mensajeria - Cluster RabbitMQ de 2 nodos (EP2)
  # rabbit1 y rabbit2 comparten el mismo Erlang cookie y forman un cluster
  # (descubrimiento declarativo en infra/rabbitmq/rabbitmq.conf).
  # ===========================================================
  rabbit1:
    image: rabbitmq:4-management-alpine
    container_name: smartlogix-rabbit1
    hostname: rabbit1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbit1-data:/var/lib/rabbitmq
    ports:
      # UI de administracion del nodo 1 (solo loopback, para demo/screenshots)
      - "127.0.0.1:15672:15672"
    networks:
      - internal
      - web   # necesaria para publicar el Management UI al host (internal: true no publica)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbit2:
    image: rabbitmq:4-management-alpine
    container_name: smartlogix-rabbit2
    hostname: rabbit2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbit2-data:/var/lib/rabbitmq
    ports:
      # UI de administracion del nodo 2 (otro puerto para verlo en paralelo)
      - "127.0.0.1:15673:15672"
    depends_on:
      - rabbit1
    networks:
      - internal
      - web   # necesaria para publicar el Management UI al host (internal: true no publica)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservicio administrador de RabbitMQ (crea/elimina colas, exchanges, bindings)
  ms-broker-admin:
    build:
      context: ./backend/ms-broker-admin
    container_name: smartlogix-ms-broker-admin
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      # Se conecta a ambos nodos del cluster (alta disponibilidad)
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SENTRY_DSN: ${MS_BROKER_ADMIN_DSN:-}
    depends_on:
      - rabbit1
      - rabbit2
    ports:
      # API REST de administracion (solo loopback, para demo)
      - "127.0.0.1:8095:8080"
    networks:
      - internal

  # ===========================================================
  # Capa de negocio - Microservicios Spring Boot
  # ===========================================================
  ms-inventory:
    build:
      context: ./backend/ms-inventory
    container_name: smartlogix-ms-inventory
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-inventory:5432/${POSTGRES_INVENTARIO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_INVENTARIO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_INVENTARIO_PASSWORD}
      SENTRY_DSN: ${MS_INVENTORY_DSN:-}
    depends_on:
      - db-inventory
    networks:
      - internal

  ms-order:
    build:
      context: ./backend/ms-order
    container_name: smartlogix-ms-order
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-order:5432/${POSTGRES_PEDIDO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_PEDIDO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PEDIDO_PASSWORD}
      SENTRY_DSN: ${MS_ORDER_DSN:-}
      MS_INVENTORY_URL: http://ms-inventory:8080
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      - db-order
      - rabbit1
      - rabbit2
    networks:
      - internal

  ms-shipping:
    build:
      context: ./backend/ms-shipping
    container_name: smartlogix-ms-shipping
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-shipping:5432/${POSTGRES_ENVIO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_ENVIO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ENVIO_PASSWORD}
      SENTRY_DSN: ${MS_SHIPPING_DSN:-}
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      - db-shipping
      - rabbit1
      - rabbit2
    networks:
      - internal

  ms-user:
    build:
      context: ./backend/ms-user
    container_name: smartlogix-ms-user
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-user:5432/${POSTGRES_USUARIO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USUARIO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_USUARIO_PASSWORD}
      SENTRY_DSN: ${MS_USER_DSN:-}
    depends_on:
      - db-user
    networks:
      - internal

  ms-auth:
    build:
      context: ./backend/ms-auth
    container_name: smartlogix-ms-auth
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://db-auth:5432/${POSTGRES_AUTH_DB}
      DB_USERNAME: ${POSTGRES_AUTH_USER}
      DB_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      SENTRY_DSN: ${MS_AUTH_DSN:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: http://ms-auth:8081
      JWT_PRIVATE_KEY_PATH: /keys/private_key.pem
      JWT_PUBLIC_KEY_PATH: /keys/public_key.pem
    volumes:
      - ./private_key.pem:/keys/private_key.pem:ro
      - ./public_key.pem:/keys/public_key.pem:ro
    depends_on:
      - db-auth
    networks:
      - internal

  # ===========================================================
  # Capa de datos - PostgreSQL 16 (DB-per-service, red privada)
  # ===========================================================
  db-inventory:
    image: postgres:16-alpine
    container_name: smartlogix-db-inventory
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_INVENTARIO_DB}
      POSTGRES_USER: ${POSTGRES_INVENTARIO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_INVENTARIO_PASSWORD}
    volumes:
      - pg-inventory-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_INVENTARIO_USER} -d ${POSTGRES_INVENTARIO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-order:
    image: postgres:16-alpine
    container_name: smartlogix-db-order
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_PEDIDO_DB}
      POSTGRES_USER: ${POSTGRES_PEDIDO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PEDIDO_PASSWORD}
    volumes:
      - pg-order-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_PEDIDO_USER} -d ${POSTGRES_PEDIDO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-shipping:
    image: postgres:16-alpine
    container_name: smartlogix-db-shipping
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_ENVIO_DB}
      POSTGRES_USER: ${POSTGRES_ENVIO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ENVIO_PASSWORD}
    volumes:
      - pg-shipping-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ENVIO_USER} -d ${POSTGRES_ENVIO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-user:
    image: postgres:16-alpine
    container_name: smartlogix-db-user
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_USUARIO_DB}
      POSTGRES_USER: ${POSTGRES_USUARIO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USUARIO_PASSWORD}
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USUARIO_USER} -d ${POSTGRES_USUARIO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-auth:
    image: postgres:16-alpine
    container_name: smartlogix-db-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    volumes:
      - pg-auth-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
