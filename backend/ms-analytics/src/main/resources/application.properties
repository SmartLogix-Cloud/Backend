spring.application.name=analytics
server.port=${SERVER_PORT:8080}

# ===================== Kafka (consumidor de streaming) =====================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=ms-analytics

# --- Consumidor ---
spring.kafka.consumer.group-id=ms-analytics
# Grupo nuevo sin offsets: parte desde el inicio del topico (reconstruye metricas)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=200
spring.kafka.consumer.properties.isolation.level=read_committed
# Rebalanceo incremental: al escalar no se detienen todas las particiones
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.fetch.min.bytes=1
spring.kafka.consumer.properties.fetch.max.wait.ms=500
spring.kafka.listener.missing-topics-fatal=false

# --- Productor: solo lo usa el DeadLetterPublishingRecoverer para escribir en los DLT ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=cl.smartlogix.analytics.streaming.JsonEventSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000

spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=false

# --- Topicos, consumer groups, paralelismo y reintentos ---
smartlogix.kafka.topics.order-events=smartlogix.order-events
smartlogix.kafka.topics.shipment-events=smartlogix.shipment-events
smartlogix.kafka.groups.orders=ms-analytics-orders
smartlogix.kafka.groups.shipments=ms-analytics-shipments
# 3 hilos consumidores = 1 por particion
smartlogix.kafka.consumer.concurrency=3
smartlogix.kafka.retry.max-retries=3
smartlogix.kafka.retry.initial-interval-ms=1000
smartlogix.kafka.retry.multiplier=2.0
# Las metricas viven en memoria: al arrancar se re-leen los topicos desde el inicio
# (replay) para reconstruirlas. La retencion de los topicos define la ventana.
smartlogix.analytics.replay-on-startup=${ANALYTICS_REPLAY_ON_STARTUP:true}
smartlogix.analytics.recent-events-size=50

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
