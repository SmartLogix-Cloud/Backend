spring.application.name=broker-admin
server.port=${SERVER_PORT:8080}

# RabbitMQ — el administrador se conecta al broker para declarar/eliminar topología
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# RabbitAdmin declara la topología de forma dinámica (default true)
spring.rabbitmq.dynamic=true

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Kafka — el administrador usa AdminClient para gestionar topicos y consumer groups
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=ms-broker-admin
spring.kafka.admin.fail-fast=false
spring.kafka.admin.auto-create=false
smartlogix.kafka.admin.timeout-ms=10000
