spring.application.name=pedido
server.port=${SERVER_PORT:8080}

# Datasource PostgreSQL
# Credenciales vía env vars SPRING_DATASOURCE_* (docker-compose en runtime, o el plugin
# spring-boot-docker-compose en dev local). Solo el nombre de BD va por defecto en la URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedido}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (Flyway es la fuente de verdad del schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# RabbitMQ (mensajeria asincrona con ms-shipping)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# ===================== Kafka (streaming de eventos) =====================
# Los 3 brokers: si uno cae, el cliente obtiene la metadata desde los otros.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=ms-order

# --- Productor: durabilidad maxima, sin duplicados, envio en lotes comprimidos ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=cl.smartlogix.order.streaming.JsonEventSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.batch-size=16384
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
# No bloquear la peticion HTTP mas de 5s si Kafka no responde
spring.kafka.producer.properties.max.block.ms=5000

# --- Consumidor: commit manual por registro (lo gestiona el container) ---
spring.kafka.consumer.group-id=ms-order
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.listener.missing-topics-fatal=false

# --- Admin: crea los topicos declarados (NewTopic) si no existen; no falla si Kafka no esta ---
spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=false

# --- Topicos, consumer groups y reintentos (centralizados) ---
smartlogix.kafka.topics.order-events=smartlogix.order-events
smartlogix.kafka.topics.shipment-events=smartlogix.shipment-events
smartlogix.kafka.groups.shipment-tracking=ms-order-shipment-tracking
smartlogix.kafka.consumer.concurrency=3
smartlogix.kafka.retry.max-retries=3
smartlogix.kafka.retry.initial-interval-ms=1000
smartlogix.kafka.retry.multiplier=2.0

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
